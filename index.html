<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT KING - Secure Loader</title>
    <style>
        body { margin: 0; background: #000814; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { padding: 12px; background: #0a0a0a; border-bottom: 2px solid #bf953f; color: #ffd700; text-align: center; font-size: 13px; letter-spacing: 1px; }
        #main-frame { flex: 1; border: none; width: 100%; background: white; }
    </style>
</head>
<body>

    

    <iframe id="main-frame" src="about:blank"></iframe>

    <script>
        async function fetchAndDecode() {
            const statusBox = document.getElementById('status');
            const frame = document.getElementById('main-frame');
            
            // Aapka GitHub link jahan .mt wala ghalat link para hai
            const sourceURL = 'https://muhammadtaqi512q-oss.github.io/OLIVEAai/mt';

            try {
                const response = await fetch(sourceURL);
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // 1. Source se ghalat link uthana (.mt wala)
                let encodedLink = doc.getElementById('target-link').innerText.trim();

                // 2. REVERSE REPLACE: .mt ko wapas .site mein badalna
                let decodedLink = encodedLink.replace('.mt', '.site');

                // 3. Theek link ko frame mein load karna
                if (decodedLink.includes('http')) {
                    frame.src = decodedLink;
                    statusBox.innerText = "System Secure & Active";
                    console.log("Decoded Successfully");
                } else {
                    statusBox.innerText = "Fetch Error";
                }

            } catch (error) {
                statusBox.innerText = "Connection Failed";
                console.error("Security Fetch Error:", error);
            }
        }

        window.onload = fetchAndDecode;
    </script>
</body>
</html>
