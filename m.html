<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M SELLER - SOURCE PROTECTED</title>
    <style>
        body {
            background: #000;
            color: #111; /* Text ko taqreeban gayab kar diya taake nazar na aaye */
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #target-link {
            user-select: none;
            cursor: default;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Ye link ghalat (.mt) hai aur display none hai taake user ko nazar na aaye -->
    <p id="target-link" style="display: none;"></p>

    <script>
        // --- 1. LINK PROTECTION ---
        // Link ko yahan fragments mein tora hai taake 'View Source' mein pura link na mil sake
        const part1 = "https://019dde21-2be3-743a-9b29-30d6969a1bdb";
        const part2 = ".arena";
        const part3 = ".mt/"; // Fake extension

        document.getElementById('target-link').innerText = part1 + part2 + part3;

        // --- 2. SECURITY BLOCKADE (F12, Ctrl+U, etc.) ---
        
        document.onkeydown = function(e) {
            // Block F12
            if (e.keyCode == 123) return false;
            // Block Ctrl+U (Source)
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            // Block Ctrl+Shift+I (Inspect)
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            // Block Ctrl+S (Save)
            if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false;
        };

        // Right click block
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Anti-Console Loop (Console khulne par page crash kar dega)
        setInterval(function() {
            const before = new Date().getTime();
            debugger;
            const after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "Security Violation!";
            }
        }, 100);
    </script>
</body>
</html>
